version: 2.1

orbs:
  redmine-plugin: agileware-jp/redmine-plugin@4.0.2

jobs:
  run_tests:
    parameters:
      redmine_version:
        type: string
        default: latest
      redmine_product:
        type: string
        default: redmine
      ruby_version:
        type: string
        default: "3.3" # https://github.com/redmine/redmine/blob/5.0.3/Gemfile#L3
      database:
        type: enum
        enum:
          - mysql
          - pg
          - mariadb
          - sqlite3
        default: pg
    executor:
      name: redmine-plugin/ruby-<< parameters.database >>
      ruby_version: << parameters.ruby_version >>
    steps:
      - checkout
      - redmine-plugin/download-redmine:
          version: << parameters.redmine_version >>
          product: << parameters.redmine_product >>
      - redmine-plugin/install-self
      - run:
          name: Rename to view_customize
          working_directory: redmine
          command: mv -v plugins/$CIRCLE_PROJECT_REPONAME plugins/view_customize
      - redmine-plugin/generate-database_yml
      - run:
          name: Install MagickWand library when rmagick.gem is used
          working_directory: redmine
          command: |
            set -eux -o pipefail
            # https://github.com/redmine/redmine/blob/4.0.9/Gemfile#L41
            grep -q 'gem "rmagick"' Gemfile || exit 0
            # rmagick.gem requires followings.
            sudo apt-get update
            sudo apt-get install -y libmagickwand-dev
      - run:
          name: Downgrade RubyGems for commonmarker's RubyGems ~> 3.4 requirement
          working_directory: redmine
          command: |
            set -eux -o pipefail
            # https://rubygems.org/gems/commonmarker/versions/2.3.2 requires RubyGems ~> 3.4
            grep -q "gem 'commonmarker', '~> 2.3" Gemfile || exit 0
            sudo gem update --system 3.4.22
      - run:
          name: Pin loofah for Redmine's pinned nokogiri version
          working_directory: redmine
          command: |
            set -eux -o pipefail
            # loofah >= 2.21 requires Nokogiri::HTML4, which nokogiri ~> 1.10.0 (pinned here) doesn't have.
            # https://github.com/flavorjones/loofah/blob/v2.21.0/CHANGELOG.md
            grep -q 'nokogiri.*~> 1.10.0' Gemfile || exit 0
            echo 'gem "loofah", "< 2.21"' >> Gemfile.local
      - redmine-plugin/bundle-install
      - redmine-plugin/test:
          plugin: view_customize
      - store_artifacts:
          path: redmine/tmp/screenshots
          destination: screenshots

workflows:
  version: 2
  test:
    jobs:
      - run_tests:
          name: latest Redmine with PostgreSQL
          database: pg
      - run_tests:
          name: latest Redmine with MySQL
          database: mysql
      - run_tests:
          name: redmine-6.1 with PostgreSQL
          redmine_version: "6.1"
          ruby_version: "3.2" # https://github.com/redmine/redmine/blob/6.1.3/Gemfile#L3
          database: pg
      - run_tests:
          name: redmine-6.0 with PostgreSQL
          redmine_version: "6.0"
          ruby_version: "3.2" # https://github.com/redmine/redmine/blob/6.0.10/Gemfile#L3
          database: pg
      - run_tests:
          name: redmine-5.1 with PostgreSQL
          redmine_version: "5.1"
          ruby_version: "3.2" # https://github.com/redmine/redmine/blob/5.1.13/Gemfile#L3
          database: pg
      - run_tests:
          name: redmine-5.0 with PostgreSQL
          redmine_version: "5.0"
          ruby_version: "3.1" # https://github.com/redmine/redmine/blob/5.0.14/Gemfile#L3
          database: pg
      - run_tests:
          name: redmine-4.2 with PostgreSQL
          redmine_version: "4.2"
          ruby_version: "2.7" # https://github.com/redmine/redmine/blob/4.2.10/Gemfile#L3
          database: pg
      - run_tests:
          name: redmine-4.0 with PostgreSQL
          redmine_version: "4.0"
          ruby_version: "2.6" # https://github.com/redmine/redmine/blob/4.0.9/Gemfile#L3
          database: pg
